# Render Blueprint: one web service that serves the website AND the API.
# Database lives in Supabase (set DATABASE_URL in the Render dashboard).
services:
  - type: web
    name: physiolink
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # OPTIONAL Supabase Storage for photos (without it, photos are saved in the database)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Google "Continue with Google" button (optional, see README step 5)
      - key: GOOGLE_CLIENT_ID
        sync: false
      # Mobile number verification + password reset by SMS (India). Fast2SMS API key, see README step 6.
      - key: FAST2SMS_API_KEY
        sync: false
      # Testing only: set to "console" to skip real SMS; the code then appears in the Render Logs.
      - key: SMS_PROVIDER
        sync: false
      # Password reset by EMAIL through Gmail (see README step 7). Your website address, no slash at the end.
      - key: APP_URL
        sync: false
      - key: GMAIL_USER
        sync: false
      # Option A (needs a paid Render plan or other host that allows SMTP): Gmail app password
      - key: GMAIL_APP_PASSWORD
        sync: false
      # Option B (works on Render free): Gmail API over HTTPS
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      # Launch with an empty app: no sample people, posts or jobs.
      - key: SEED_DEMO_DATA
        value: "false"
      # Set to "true" for ONE deploy to wipe sample data already in your database, then remove it.
      - key: PURGE_DEMO_DATA
        value: "false"
